<main class='container'>
    <div class='speak-up'>
        <div class='bubble bubble-dark'>
            <h1>You Did It!</h1>
        </div>
    </div>
    <p v-if="error" class="error">{{ error }}</p>
    <select v-if="summary" v-model="activeChain">
        <option disabled v-bind:value="null">Select a story</option>
        <option v-for="story in stories" v-bind:value="story.index" :key="story.index">{{ story.label }}</option>
    </select>
    <div v-for="(step, index) in activeSteps" :key="index"
            v-bind:class=" step.type == 'drawing' ? 'chat-right' : 'chat-left' ">
        <h5>
            {{ authorName(step.authorId) }}
        </h5>
        <div class="speak-up">
            <div v-if="step.skipped" class="bubble skipped">
                (skipped)
            </div>
            <div class='bubble' v-else-if="step.image">
                <img v-bind:src="step.image">
            </div>
            <div v-else class="bubble bubble-dark">
                {{ step.text }}
            </div>
        </div>
    </div>
    <router-link to="/" class="btn btn-secondary home-btn">
        New Game
    </router-link>
</main>
