<main class="home container">
    <h1>Drawsaster</h1>
    <p>
        A telephone-style drawing game for 3 or more players
    </p>
    <div v-if="session" class="current-game">
        <router-link :to="resumePath" class="btn btn-primary col-12 col-md-3">
            Back to game {{ session.code }}
        </router-link>
        <button class="link-btn" v-on:click="leave()">Leave game {{ session.code }}</button>
    </div>
    <router-link to="/join" class="btn btn-primary col-12 col-md-3">
        Join Game
    </router-link>
    <router-link to="/create" class="mt-3 btn btn-primary col-12 col-md-3">
        New Game
    </router-link>
    <router-link to="/about" class="mt-3 btn btn-secondary col-12 col-md-3">
        How To
    </router-link>
</main>
